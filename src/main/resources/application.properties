# ── Server ─────────────────────────────────────────────────────
# Locally defaults to 8080; on Render the PORT env var is used.
server.port=${PORT:8080}

# ── Datasource (PostgreSQL) ────────────────────────────────────
# Managed providers (Neon, Render, ...) expose a DATABASE_URL connection string
# (postgresql://user:pass@host/db?sslmode=require). It is converted to a JDBC URL
# automatically by DatabaseUrlEnvironmentPostProcessor.
# The defaults below target the local Postgres from docker-compose.yml.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/werewolf}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Performance / static assets ────────────────────────────────
# gzip text assets (html/css/js/json/svg) to cut transfer size
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# let browsers cache static assets (images, audio, css, js)
spring.web.resources.cache.cachecontrol.max-age=1d
spring.web.resources.cache.cachecontrol.cache-public=true
