# ── Server ─────────────────────────────────────────────────────
# Locally defaults to 8080; on Render the PORT env var is used.
server.port=${PORT:8080}

# ── Datasource (PostgreSQL) ────────────────────────────────────
# Render's managed Postgres exposes PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD.
# Local defaults target a local Postgres (see docker-compose.yml).
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:werewolf}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
