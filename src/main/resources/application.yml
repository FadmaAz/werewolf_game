spring:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

  # DevTools configuration
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
    livereload:
      enabled: true
      port: 35729

# Simple defaults (seconds)
werewolf:
  phase:
    wolves: 60
    seer: 45
    witch: 60
    chat: 90
    vote: 45